linkWorkspacePackages: deep
preferWorkspacePackages: true
publicHoistPattern:
  - "*ember-core*"
  - "*ember-ui*"
  - "*fleetops-data*"
overrides:
  "@fleetbase/ai-engine": "file:../packages/ai"
  "@fleetbase/dev-engine": "file:../packages/dev-engine"
  "@fleetbase/ember-core": "file:../packages/ember-core"
  "@fleetbase/ember-ui": "file:../packages/ember-ui"
  "@fleetbase/fleetops-data": "file:../packages/fleetops-data"
  "@fleetbase/fleetops-engine": "file:../packages/fleetops"
  "@fleetbase/iam-engine": "file:../packages/iam-engine"
  "@fleetbase/intl-lint": "file:../packages/intl-lint"
  "@fleetbase/leaflet-routing-machine": "file:../packages/routing-machine"
  "@fleetbase/ledger-engine": "file:../packages/ledger"
  "@fleetbase/pallet-engine": "file:../packages/pallet"
  "@fleetbase/registry-bridge-engine": "file:../packages/registry-bridge"
  "@fleetbase/sdk": "file:../packages/sdk"
  "@fleetbase/storefront": "file:../packages/storefront-sdk"
  "@fleetbase/storefront-engine": "file:../packages/storefront"
  "@fleetbase/valhalla-engine": "file:../packages/valhalla"
  "@fleetbase/vroom-engine": "file:../packages/vroom"
  "fleetbase-extensions-indexer": "file:../packages/fleetbase-extensions-indexer"
allowBuilds:
