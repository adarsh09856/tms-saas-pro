  "@fortawesome/fontawesome-svg-core": false
  "@fortawesome/free-brands-svg-icons": false
  "@fortawesome/free-solid-svg-icons": false
  core-js: false
  fsevents: false
minimumReleaseAgeExclude:
  - '@fleetbase/ember-core@0.3.26'
  - '@fleetbase/ember-ui@0.4.6'
  - '@fleetbase/fleetops-data@0.2.3'
  - '@fleetbase/fleetops-engine@0.6.75'
  - '@fleetbase/storefront-engine@0.4.31'
  - '@fleetbase/ledger-engine@0.0.13'
  - '@fleetbase/dev-engine@0.2.18'
  - '@fleetbase/registry-bridge-engine@0.1.11'
  - '@fleetbase/valhalla-engine@0.0.5'
  - '@fleetbase/vroom-engine@0.0.5'
